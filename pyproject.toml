[project]
name = "travel-planner"
version = "1.0.0"
description = "AI-powered multi-city travel planning assistant using LangChain"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.5",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
